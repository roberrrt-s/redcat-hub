# The hub is plain static content, so this site CAN use git-connected CI
# builds — unlike the game ports, whose assets are generated from the original
# discs and deploy via `netlify deploy` from a machine that has them.

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints everything under /assets, so those may cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The ports live under this domain as paths, proxied to their own Netlify
# sites (200 = rewrite, the address bar keeps this domain). The game builds
# with a relative Vite `base`, so its assets resolve under the prefix.
#
# RULE ORDER MATTERS: Netlify matches `from` paths with AND without trailing
# slash, so a bare-path 301 listed first also caught the slashed URL and
# redirected it to itself, forever. The proxy comes first — slashed requests
# never reach the 301 — and the 301 only catches the bare path, whose
# relative asset URLs would otherwise resolve one level too high.
#
# Re-verified on a draft deploy, 2026-08-21: the loop is still real, and so
# is the flip side — with the proxy first, the BARE path never reaches the
# 301 either (the /* rule matches it), so it serves the app with its
# relative assets broken. The ports therefore carry a one-line inline guard
# in their index.html that bounces /pad to /pad/ before any asset loads;
# these rules alone cannot express "301 the bare path, proxy the rest".
[[redirects]]
  from = "/de-spannende-stedentocht/*"
  to = "https://redcat-stedentocht.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/de-spannende-stedentocht"
  to = "/de-spannende-stedentocht/"
  status = 301

[[redirects]]
  from = "/de-knallende-komeet/*"
  to = "https://redcat-knallende-komeet.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/de-knallende-komeet"
  to = "/de-knallende-komeet/"
  status = 301
